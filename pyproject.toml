[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-yolo-backdoor"
version = "1.0.0"
description = "Federated Learning with YOLO for Adaptive Trigger Attacks"
dependencies = [
    "flwr>=1.12.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "pyyaml"
]

[tool.flwr.app]
publisher = "limulu"

[tool.flwr.app.components]
serverapp = "fl_yolo_backdoor.server_app:app"
clientapp = "fl_yolo_backdoor.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
local-epochs = 5      
total-clients = 100
fraction-fit = 0.2

# ==========================================
# 🚨 AnywhereDoor Backdoor Configurations
# ==========================================
attack-flag = true
attacker-ratio = 0.5
poison-rate = 0.5
trigger-size = 32
source-class = 1  
target-class = 0  

# 공격 강도 튜닝 파라미터
epsilon = 0.05
trigger-inner-steps = 1