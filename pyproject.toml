[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-yolo-backdoor"
version = "3.6.0"
description = "Federated Learning AnywhereDoor (Strict Factorization & Active Masking)"
dependencies = [
    "flwr>=1.12.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "pyyaml"
]

[tool.flwr.app]
publisher = "limulu"

[tool.flwr.app.components]
serverapp = "fl_yolo_backdoor.server_app:app"
clientapp = "fl_yolo_backdoor.client_app:app"

[tool.flwr.app.config]
# [Smoke Test 설정] 
num-server-rounds = 50
local-epochs = 2  
total-clients = 100
fraction-fit = 0.2

# ==========================================
# 🚪 True AnywhereDoor Configs
# ==========================================
reset-global-generator = true

attack-flag = true
attacker-ratio = 0.5
poison-rate = 0.5    
trigger-size = 32
num-classes = 3         

eval-attack-mode = "targeted_miscls" 

# 공격 강도 튜닝 파라미터 
epsilon = 0.10          
generator-lr = 0.01    
trigger-inner-steps = 1

# ASR 평가 전용 파라미터 (Multi-pair GT Base)
asr-conf-thresh = 0.1
asr-max-pairs = 6
asr-num-samples = 100
asr-seed = 2026