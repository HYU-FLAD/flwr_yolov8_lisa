[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-yolo-backdoor"
version = "3.6.0"
description = "Federated Learning AnywhereDoor (Clean FL Baseline - nc=2)"
dependencies = [
    "flwr>=1.12.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "pyyaml"
]

[tool.flwr.app]
publisher = "limulu"

[tool.flwr.app.components]
serverapp = "fl_yolo_backdoor.server_app:app"
clientapp = "fl_yolo_backdoor.client_app:app"

[tool.flwr.app.config]
# ==========================================
# 🟩 실험 기본 설정 (mAP Recovery & Stability)
# ==========================================
num-server-rounds = 20
local-epochs = 5
total-clients = 20
fraction-fit = 0.3

# ⚙️ Training Hyperparameters (Centralized mimic)
local-batch = 8
optimizer = "AdamW"
local-lr0 = 0.001
min-lr = 0.0001
lr-decay = 0.99

# 🎨 YOLO Augmentations & Freeze (Weak Augmentations)
yolo-mosaic = 0.0
yolo-erasing = 0.0
yolo-fliplr = 0.0
yolo-hsv-h = 0.003
yolo-hsv-s = 0.1
yolo-hsv-v = 0.1
yolo-scale = 0.1
yolo-translate = 0.03
yolo-warmup-epochs = 0.0
yolo-freeze = 10

# ==========================================
# 🚪 AnywhereDoor 공격 설정 (수정됨)
# ==========================================
reset-global-generator = true
attack-flag = true
attack-start-round = 3
attacker-ratio = 0.2        # 라운드당 평균 0.8~1명의 공격자 참여
poison-rate = 0.2           # 배치 내 20% 데이터 오염

num-classes = 2
eval-attack-mode = "targeted_miscls" 

# 고정 클래스 쌍 설정 (Go -> Stop 등)
fixed-source-class = 0
fixed-target-class = 1

trigger-size = 32
epsilon = 0.05              # 트리거 강도 조절 (너무 강하면 mAP 급락)
generator-lr = 0.005
trigger-inner-steps = 1

asr-conf-thresh = 0.1
asr-max-pairs = 6
asr-num-samples = 100
asr-seed = 2026

# ==========================================
# Federation 설정 (복구됨)
# ==========================================

#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
