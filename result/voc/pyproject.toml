[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-yolo-backdoor"
version = "3.6.0"
description = "Federated Learning YOLO Backdoor Test"
dependencies = [
    "flwr>=1.12.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "pyyaml"
]

[tool.flwr.app]
publisher = "limulu"

[tool.flwr.app.components]
serverapp = "fl_yolo_backdoor.server_app:app"
clientapp = "fl_yolo_backdoor.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 100
local-epochs = 3
total-clients = 100
fraction-fit = 0.3

dataset-name = "voc"
num-classes = 20

data-yaml = "datas/voc_yolo/data.yaml"
partition-root = "datas/voc_yolo/client_isolated_100"
model-yaml = "yolov8n_voc.yaml"
pretrained-weights = "yolov8n.pt"

local-batch = 32
optimizer = "AdamW"
local-lr0 = 0.001
min-lr = 0.0001
lr-decay = 0.99

yolo-mosaic = 0.1
yolo-erasing = 0.1
yolo-fliplr = 0.1
yolo-hsv-h = 0.003
yolo-hsv-s = 0.1
yolo-hsv-v = 0.1
yolo-scale = 0.1
yolo-translate = 0.030
yolo-warmup-epochs = 0.1
yolo-freeze = 0

reset-global-generator = true
attack-flag = true
attack-start-round = 5

attacker-ratio = 0.2
poison-rate = 0.3

trigger-size = 32
epsilon = 0.1
generator-lr = 0.01
trigger-inner-steps = 2
generator-target-only = true

# 🎯 분석 사항 반영: 주석 해제하여 Source-rich Attacker 전략 실제 적용 보장
attacker-ids-json = "datas/voc_yolo/attackers.json"

eval-attack-mode = "targeted_miscls"

# VOC: car(6) -> bus(5)
fixed-source-class = 11
fixed-target-class = 7

asr-conf-thresh = 0.1
asr-max-pairs = 6
asr-num-samples = 2000
asr-seed = 2026



